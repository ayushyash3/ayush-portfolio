name: Deploy React Portfolio
on:
  push:
    branches: ["master"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-Detect and Build
        run: |
          # Find the folder containing package.json
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Found package.json in: $TARGET_DIR"
          cd "$TARGET_DIR"
          npm install --legacy-peer-deps
          npm run build
          # Move the build folder to the root so the next step finds it
          mv build ../../build_output 2>/dev/null || mv build ../build_output
          
      - name: Auto-Detect and Build
        run: |
          # 1. Force the missing bridge package onto the server
          npm install @tailwindcss/postcss postcss autoprefixer --save-dev
          
          # 2. Overwrite the bad config file directly on the server
          echo "module.exports = { plugins: { '@tailwindcss/postcss': {}, autoprefixer: {} } }" > postcss.config.js
          
          # 3. Build and ignore all warnings/mismatches
          CI=false npm run build    

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # We upload the folder we just moved to the root
          path: ./build_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4